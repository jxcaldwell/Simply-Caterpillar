# Simply Caterpillar configuration.

# Language file to use (lang/<name>.yml in this folder; en_us is shipped).
language: en_us

drill:
  # Ticks of burning fuel between two drill-and-advance steps (original mod: 60 = 3 seconds).
  head-interval-ticks: 60
  # Ticks between each trailing segment catching up with the head (original mod: 20).
  segment-interval-ticks: 20
  # Can the drill break normally unbreakable blocks (see unbreakable-blocks below)?
  break-unbreakable: false
  # Item the drill "mines" with. This decides which blocks drop items and what they drop.
  # NETHERITE_PICKAXE lets it harvest everything; nothing is ever used up.
  tool: NETHERITE_PICKAXE
  # Maximum number of segments behind the head.
  max-segments: 32

effects:
  sounds: true
  particles: true

protection:
  # Caterpillar blocks cannot be destroyed by explosions or moved by pistons.
  explosion-proof: true

recipes:
  # Unlock the recipes for players when they join.
  discover-on-join: true

resource-pack:
  # Offer the resource pack with the original Simply Caterpillar models to players when they join. Players who
  # decline it (and Bedrock players) keep seeing the plain blocks below.
  enabled: true
  # Disconnect Java players who decline the pack.
  required: false
  # Show the original 3D models on caterpillars in the world to players who loaded the pack. With it, those
  # players break caterpillar parts by sneaking and left-clicking them.
  world-models: true
  # Leave empty to use the pack published with this plugin build on GitHub. To host it yourself, put the
  # direct download link and the SHA-1 of the zip here.
  url: ""
  sha1: ""

# Blocks used to build the machine. Use block materials that are NOT containers and do not
# change by themselves. Placed items are tagged, so these materials can still be used normally.
blocks:
  head-base: GRAY_GLAZED_TERRACOTTA
  head-bit: IRON_BLOCK
  head-bit-center: REDSTONE_LAMP
  # Shown in place of head-bit-center while the head is drilling (it "lights up").
  head-bit-center-active: GLOWSTONE
  segment-spacer: WAXED_COPPER_BLOCK
  storage: DARK_OAK_PLANKS
  collector: LAPIS_BLOCK
  incinerator: RED_NETHER_BRICKS
  # A stair block looks like a seat; it is turned to face the way the caterpillar travels.
  seat: QUARTZ_STAIRS
  transporter: CYAN_CONCRETE
  # The block shown under a transporter while it carries a chest minecart.
  transporter-cart: BROWN_TERRACOTTA
  reinforcement: CHISELED_STONE_BRICKS
  decoration: CHISELED_SANDSTONE

collector:
  # How far from the collector segment (in blocks, measured from its faces) dropped items are picked up.
  # Items are collected while the caterpillar is running and right after the drill breaks blocks, so place the
  # collector directly behind the drill head.
  radius: 3.0
  # Collected items that a part needs (blocks in a reinforcement or decoration pattern, chest minecarts for a
  # transporter) go to the consumption slots first, until there are this many of that item there. The rest goes to
  # the gathered slots as usual. 0 turns this off.
  supply-amount: 64

# When a part runs out of an item it needs, the owner gets a chat message, at most once every this many seconds
# per item. 0 turns the messages off.
supply-warning-seconds: 60

seat:
  # Height of the invisible seat above the seat block's floor. Raise or lower it if riders look too high or low.
  y-offset: 0.4

# Blocks the drill treats as unbreakable.
unbreakable-blocks:
  - BEDROCK
  - BARRIER
  - STRUCTURE_BLOCK
  - STRUCTURE_VOID
  - END_PORTAL_FRAME
  - END_PORTAL
  - END_GATEWAY
  - COMMAND_BLOCK
  - CHAIN_COMMAND_BLOCK
  - REPEATING_COMMAND_BLOCK
  - JIGSAW
  - REINFORCED_DEEPSLATE

# Fuel accepted by the drill head and its burn time in ticks (same numbers as a furnace).
# Keys starting with # are item tags.
fuels:
  COAL: 1600
  CHARCOAL: 1600
  COAL_BLOCK: 16000
  LAVA_BUCKET: 20000
  BLAZE_ROD: 2400
  DRIED_KELP_BLOCK: 4000
  BAMBOO: 50
  STICK: 100
  "#minecraft:planks": 300
  "#minecraft:logs_that_burn": 300
