# Builds the Paper plugin and runs the unit tests.

name: Build plugin

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build and test
        run: |
          set +e
          ./gradlew build --no-daemon > build.log 2>&1
          status=$?
          cat build.log
          if [ $status -ne 0 ]; then
            # Surface the failure reasons as annotations so they are visible without opening the log.
            grep -E "error:|warning: \[|FAILED|AssertionFailedError|Exception|What went wrong|Could not" build.log | head -40 \
              | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          exit $status
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: SimplyCaterpillar_JAR
          path: build/libs/*.jar
