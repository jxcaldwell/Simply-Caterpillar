# Builds the Paper plugin and its resource pack and runs the unit tests.
# - A push to paper-plugin is published as a pre-release "build-<commit>" (jar + pack); only the 10 newest are kept.
# - A tag v* (e.g. v1.0.0) is published as a full release with the notes from CHANGELOG.md; it is never pruned.
# The plugin offers the pack from the release it was built for, so releases must stay public.

name: Build plugin

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build and test
        run: |
          set +e
          ./gradlew build --no-daemon > build.log 2>&1
          status=$?
          cat build.log
          if [ $status -ne 0 ]; then
            # Surface the failure reasons as annotations so they are visible without opening the log.
            grep -E -A3 "error:|^e: |FAILED|AssertionFailedError|Exception|What went wrong|Could not" build.log | head -60 \
              | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          exit $status
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: SimplyCaterpillar_JAR
          path: |
            build/libs/*.jar
            build/pack/SimplyCaterpillar-pack.zip
      - name: Publish pre-release (jar + resource pack)
        if: github.event_name == 'push' && github.ref == 'refs/heads/paper-plugin'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          short="${GITHUB_SHA::7}"
          tag="build-${short}"
          gh release create "$tag" build/libs/*.jar build/pack/SimplyCaterpillar-pack.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Paper plugin build ${short}" \
            --notes "Automatic build of commit ${GITHUB_SHA} on paper-plugin. Install the jar in plugins/. The resource pack is offered to players automatically."
          # Keep only the 10 newest automatic builds.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
            | while read -r old; do gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag; done
      - name: Publish release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Release notes: the CHANGELOG.md section of this version.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          title="Simply Caterpillar ${version} for Paper 26.2"
          # The release may already exist (created on the GitHub website, or by the other of the two events a
          # website release triggers): then just attach the files and set the title and notes.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/libs/*.jar build/pack/SimplyCaterpillar-pack.zip \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --notes-file release-notes.md --prerelease=false --latest
          else
            gh release create "$GITHUB_REF_NAME" build/libs/*.jar build/pack/SimplyCaterpillar-pack.zip \
              --repo "$GITHUB_REPOSITORY" --verify-tag --latest --title "$title" --notes-file release-notes.md
          fi
